<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SN 利润工作台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #697684;
      --hairline: rgba(30, 42, 56, 0.12);
      --glass: rgba(255, 255, 255, 0.68);
      --glass-strong: rgba(255, 255, 255, 0.84);
      --blue: #007aff;
      --mint: #12b886;
      --amber: #ffb020;
      --rose: #ff5a7a;
      --shadow: 0 22px 70px rgba(48, 68, 88, 0.18);
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 222, 128, 0.48), transparent 28%),
        radial-gradient(circle at 82% 6%, rgba(120, 214, 255, 0.52), transparent 30%),
        linear-gradient(145deg, #f8fbff 0%, #edf7f2 44%, #fff7ec 100%);
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .phone {
      width: min(430px, 100%);
      min-height: min(920px, calc(100vh - 56px));
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 44px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.35)),
        rgba(255, 255, 255, 0.36);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(145%);
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 10px 10px auto;
      height: 28px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }

    .app {
      position: relative;
      height: 100%;
      padding: 28px 18px 22px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 2px 14px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .sync-pill {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      color: #31515b;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(18px);
      white-space: nowrap;
    }

    .hero-metric {
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.48)),
        rgba(255, 255, 255, 0.52);
      box-shadow: 0 18px 42px rgba(72, 93, 108, 0.12);
      backdrop-filter: blur(28px) saturate(150%);
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 14px;
    }

    .label {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .money {
      margin: 6px 0 0;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
    }

    .delta {
      justify-self: end;
      padding: 8px 10px;
      border-radius: 999px;
      color: #07694e;
      background: rgba(18, 184, 134, 0.14);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 18px;
    }

    .mini {
      min-width: 0;
      padding: 12px 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.52);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .mini span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .mini strong {
      display: block;
      margin-top: 5px;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 15px 0;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.64);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(18px);
    }

    .tab {
      min-height: 40px;
      border-radius: 999px;
      color: #596575;
      background: transparent;
      font-size: 14px;
      font-weight: 800;
    }

    .tab.active {
      color: #0e1c2b;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 8px 22px rgba(82, 103, 122, 0.14);
    }

    .panel {
      display: none;
      animation: rise 260ms ease both;
    }

    .panel.active {
      display: block;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass {
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      background: var(--glass);
      box-shadow: 0 14px 36px rgba(72, 93, 108, 0.12);
      backdrop-filter: blur(26px) saturate(150%);
    }

    .form {
      padding: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #556373;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 45px;
      border: 1px solid var(--hairline);
      border-radius: 16px;
      outline: 0;
      padding: 0 13px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .field input:focus,
    .field select:focus {
      border-color: rgba(0, 122, 255, 0.42);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }

    .scan-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 10px 0 14px;
    }

    .tool-btn,
    .primary,
    .link-btn {
      min-height: 46px;
      border-radius: 999px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .tool-btn {
      color: #163449;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.86);
    }

    .primary {
      width: 100%;
      margin-top: 14px;
      color: white;
      background: linear-gradient(135deg, #111827, #2e3b4d);
      box-shadow: 0 12px 26px rgba(24, 35, 49, 0.22);
    }

    .link-btn {
      display: grid;
      place-items: center;
      width: 100%;
      color: white;
      background: linear-gradient(135deg, #007aff, #35c7a2);
      box-shadow: 0 12px 26px rgba(0, 122, 255, 0.18);
    }

    .hint {
      min-height: 18px;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .hint.warn {
      color: #b4233f;
    }

    .quick-profit {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .bubble {
      padding: 13px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.56);
    }

    .bubble span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .bubble strong {
      display: block;
      margin-top: 5px;
      font-size: 19px;
    }

    .searchbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      margin-bottom: 11px;
    }

    .searchbar input {
      min-height: 45px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 999px;
      padding: 0 16px;
      outline: 0;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(18px);
    }

    .select-pill {
      min-height: 45px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 999px;
      padding: 0 12px;
      outline: 0;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
    }

    .record-list {
      display: grid;
      gap: 10px;
      max-height: 445px;
      overflow: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }

    .record-list::-webkit-scrollbar {
      display: none;
    }

    .record {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82);
    }

    .record-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .record h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .tag {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      color: #0c6b4d;
      background: rgba(18, 184, 134, 0.13);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .tag.loss {
      color: #a31b34;
      background: rgba(255, 90, 122, 0.14);
    }

    .tag-stack {
      flex: 0 0 auto;
      display: grid;
      justify-items: end;
      gap: 7px;
    }

    .return-pill {
      padding: 6px 9px;
      border-radius: 999px;
      color: #6c4a00;
      background: rgba(255, 176, 32, 0.16);
      font-size: 11px;
      font-weight: 850;
      white-space: nowrap;
    }

    .return-pill.safe {
      color: #0c6b4d;
      background: rgba(18, 184, 134, 0.13);
    }

    .return-pill.expired {
      color: #53606d;
      background: rgba(84, 96, 109, 0.12);
    }

    .return-pill.pending {
      color: #31515b;
      background: rgba(255, 255, 255, 0.62);
    }

    .sn {
      margin: 7px 0 0;
      color: #455362;
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .meta div {
      padding: 9px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.5);
    }

    .meta span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .meta strong {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .record-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 10px;
    }

    .ghost {
      min-height: 36px;
      border-radius: 999px;
      color: #27445d;
      background: rgba(255, 255, 255, 0.64);
      font-size: 12px;
      font-weight: 850;
    }

    .delete {
      width: 42px;
      min-height: 36px;
      border-radius: 999px;
      color: #a31b34;
      background: rgba(255, 90, 122, 0.12);
      font-weight: 900;
    }

    .tools {
      display: grid;
      gap: 12px;
    }

    .tool-card {
      padding: 16px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .tool-card h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .tool-card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .brand-link {
      min-height: 42px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.65);
      color: #20344a;
      font-size: 13px;
      font-weight: 850;
    }

    .empty {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 520px) {
      .stage {
        display: block;
        padding: 0;
      }

      .phone {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border: 0;
        box-shadow: none;
      }

      .app {
        padding: 22px 14px 18px;
      }

      .phone::before {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="SN 利润工作台手机预览">
      <div class="app">
        <header class="topbar">
          <div>
            <p class="eyebrow">数码单品利润</p>
            <h1>SN 工作台</h1>
          </div>
          <div class="sync-pill">本地草稿</div>
        </header>

        <section class="hero-metric" aria-label="利润概览">
          <div class="metric-row">
            <div>
              <p class="label">本月净利润</p>
              <p class="money" id="monthProfit">¥0</p>
            </div>
            <div class="delta" id="profitRate">0 台</div>
          </div>
          <div class="mini-grid">
            <div class="mini">
              <span>本月销售</span>
              <strong id="monthSales">¥0</strong>
            </div>
            <div class="mini">
              <span>本月成本</span>
              <strong id="monthCost">¥0</strong>
            </div>
            <div class="mini">
              <span>平均单利</span>
              <strong id="avgProfit">¥0</strong>
            </div>
          </div>
        </section>

        <nav class="tabs" aria-label="页面切换">
          <button class="tab active" data-tab="add" type="button">录入</button>
          <button class="tab" data-tab="records" type="button">明细</button>
          <button class="tab" data-tab="tools" type="button">工具</button>
        </nav>

        <section class="panel active" id="tab-add">
          <form class="glass form" id="entryForm">
            <div class="field full">
              <label for="sn">SN 码</label>
              <input id="sn" name="sn" autocomplete="off" placeholder="拍照 / 扫码 / 粘贴识别" />
            </div>

            <div class="scan-row">
              <button class="tool-btn" id="pasteSn" type="button">粘贴识别</button>
              <button class="tool-btn" id="uploadSn" type="button">图片识别</button>
            </div>
            <input class="hidden" id="snImage" type="file" accept="image/*" capture="environment" />

            <div class="form-grid">
              <div class="field">
                <label for="category">品类</label>
                <select id="category" name="category">
                  <option>手机</option>
                  <option>电脑</option>
                  <option>平板</option>
                  <option>耳机</option>
                  <option>手表</option>
                </select>
              </div>
              <div class="field">
                <label for="brand">品牌</label>
                <input id="brand" name="brand" placeholder="华为 / 苹果" />
              </div>
              <div class="field full">
                <label for="name">商品名称</label>
                <input id="name" name="name" placeholder="iPhone 16 Pro 256G 原色" />
              </div>
              <div class="field">
                <label for="model">型号</label>
                <input id="model" name="model" placeholder="A3294" />
              </div>
              <div class="field">
                <label for="partner">下单人</label>
                <input id="partner" name="partner" placeholder="朋友A" />
              </div>
              <div class="field">
                <label for="buyPrice">机器成本</label>
                <input id="buyPrice" name="buyPrice" inputmode="decimal" placeholder="0" />
              </div>
              <div class="field">
                <label for="gift">礼金</label>
                <input id="gift" name="gift" inputmode="decimal" placeholder="0" />
              </div>
              <div class="field">
                <label for="shipping">运费</label>
                <input id="shipping" name="shipping" inputmode="decimal" placeholder="0" />
              </div>
              <div class="field">
                <label for="otherCost">其他成本</label>
                <input id="otherCost" name="otherCost" inputmode="decimal" placeholder="0" />
              </div>
              <div class="field">
                <label for="isSold">是否卖出</label>
                <select id="isSold" name="isSold">
                  <option value="yes">已卖出</option>
                  <option value="no">未卖出</option>
                </select>
              </div>
              <div class="field">
                <label for="salePrice">卖出价</label>
                <input id="salePrice" name="salePrice" inputmode="decimal" placeholder="未卖可先空着" />
              </div>
              <div class="field">
                <label for="date">下单日期</label>
                <input id="date" name="date" type="date" />
              </div>
              <div class="field">
                <label for="signedAt">签收时间</label>
                <input id="signedAt" name="signedAt" type="datetime-local" />
              </div>
              <div class="field full">
                <label for="dockTracking">发到档口快递单号</label>
                <input id="dockTracking" name="dockTracking" autocomplete="off" placeholder="顺丰 / 京东 / 德邦单号" />
              </div>
            </div>

            <div class="quick-profit">
              <div class="bubble">
                <span>预计总成本</span>
                <strong id="liveCost">¥0</strong>
              </div>
              <div class="bubble">
                <span>预计利润</span>
                <strong id="liveProfit">¥0</strong>
              </div>
            </div>
            <p class="hint" id="formHint"></p>
            <button class="primary" type="submit">保存这台机器</button>
          </form>
        </section>

        <section class="panel" id="tab-records">
          <div class="searchbar">
            <input id="search" placeholder="搜 SN / 型号 / 品牌 / 下单人" />
            <select class="select-pill" id="categoryFilter" aria-label="品类筛选">
              <option value="">全部</option>
              <option>手机</option>
              <option>电脑</option>
              <option>平板</option>
              <option>耳机</option>
              <option>手表</option>
            </select>
          </div>
          <div class="record-list" id="recordList"></div>
        </section>

        <section class="panel" id="tab-tools">
          <div class="tools">
            <article class="glass tool-card">
              <h2>激活 / 保修查询</h2>
              <p>当前先放华为入口，后面可以继续补苹果、小米、荣耀、OPPO、vivo 等品牌。</p>
              <a class="link-btn" href="https://consumer.huawei.com/cn/support/warranty-query" target="_blank" rel="noopener">打开华为查询</a>
            </article>
            <article class="glass tool-card">
              <h2>常用品牌入口</h2>
              <div class="brand-grid">
                <a class="brand-link" href="https://checkcoverage.apple.com/" target="_blank" rel="noopener">苹果查询</a>
                <a class="brand-link" href="https://consumer.huawei.com/cn/support/warranty-query" target="_blank" rel="noopener">华为查询</a>
                <a class="brand-link" href="https://www.mi.com/service/imei" target="_blank" rel="noopener">小米查询</a>
                <a class="brand-link" href="https://support.oppo.com/cn/warranty-check/" target="_blank" rel="noopener">OPPO 查询</a>
              </div>
            </article>
            <article class="glass tool-card">
              <h2>数据操作</h2>
              <p>导出会生成 JSON 文件，后面正式版可以升级成 Excel 和多人云端同步。</p>
              <div class="scan-row">
                <button class="tool-btn" id="exportData" type="button">导出数据</button>
                <button class="tool-btn" id="resetDemo" type="button">恢复示例</button>
              </div>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "sn-profit-records-v1";
    const money = new Intl.NumberFormat("zh-CN", {
      style: "currency",
      currency: "CNY",
      maximumFractionDigits: 0
    });

    const today = new Date().toISOString().slice(0, 10);
    const now = new Date();
    function createDemoRecords() {
      return [
        {
          id: crypto.randomUUID(),
          sn: "HJQ7N24C0X9P",
          category: "手机",
          brand: "华为",
          name: "Mate 70 Pro 512G 雪域白",
          model: "PLR-AL10",
          partner: "阿明",
          buyPrice: 6499,
          gift: 180,
          shipping: 18,
          otherCost: 0,
          salePrice: 7040,
          isSold: true,
          date: today,
          signedAt: localDateTimeValue(daysAgo(2)),
          dockTracking: "SF1234567890"
        },
        {
          id: crypto.randomUUID(),
          sn: "F2LXN8QK7M9R",
          category: "平板",
          brand: "苹果",
          name: "iPad Air 11 英寸 256G",
          model: "A2902",
          partner: "小陈",
          buyPrice: 4599,
          gift: 120,
          shipping: 15,
          otherCost: 0,
          salePrice: 4930,
          isSold: true,
          date: today,
          signedAt: localDateTimeValue(daysAgo(8)),
          dockTracking: "JD9876543210"
        }
      ];
    }

    const form = document.querySelector("#entryForm");
    const fields = [...form.elements].filter((item) => item.name);
    const recordList = document.querySelector("#recordList");
    const searchInput = document.querySelector("#search");
    const categoryFilter = document.querySelector("#categoryFilter");
    const hint = document.querySelector("#formHint");
    const snInput = document.querySelector("#sn");
    const imageInput = document.querySelector("#snImage");
    let records = loadRecords();

    document.querySelector("#date").value = today;

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
        document.querySelectorAll(".panel").forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector(`#tab-${tab.dataset.tab}`).classList.add("active");
      });
    });

    form.addEventListener("input", () => {
      normalizeSnInput(false);
      updateLiveProfit();
      checkDuplicate();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const record = readForm();
      if (!record.sn || !record.name || (record.isSold && !record.salePrice)) {
        showHint("SN、商品名称必填；已卖出时需要填写卖出价。", true);
        return;
      }

      const duplicate = records.find((item) => item.sn === record.sn);
      if (duplicate) {
        showHint(`这个 SN 已存在：${duplicate.name}`, true);
        return;
      }

      records.unshift(record);
      saveRecords();
      form.reset();
      document.querySelector("#date").value = today;
      showHint("已保存，利润和明细已更新。");
      render();
      switchTab("records");
    });

    searchInput.addEventListener("input", renderRecords);
    categoryFilter.addEventListener("change", renderRecords);

    document.querySelector("#pasteSn").addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        const sn = extractSn(text);
        if (!sn) {
          showHint("剪贴板里没有识别到像 SN 的内容。", true);
          return;
        }
        snInput.value = sn;
        normalizeSnInput();
        updateLiveProfit();
      } catch {
        showHint("浏览器没有给剪贴板权限，可以直接长按粘贴。", true);
      }
    });

    document.querySelector("#uploadSn").addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", scanImage);

    document.querySelector("#exportData").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `sn-profit-${today}.json`;
      link.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#resetDemo").addEventListener("click", () => {
        records = createDemoRecords();
        saveRecords();
        render();
      });

    recordList.addEventListener("click", (event) => {
      const deleteButton = event.target.closest("[data-delete]");
      const copyButton = event.target.closest("[data-copy]");
      if (deleteButton) {
        records = records.filter((item) => item.id !== deleteButton.dataset.delete);
        saveRecords();
        render();
      }
      if (copyButton) {
        const record = records.find((item) => item.id === copyButton.dataset.copy);
        if (record) {
          navigator.clipboard?.writeText(record.sn);
          showHint(`已复制 SN：${record.sn}`);
        }
      }
    });

    render();

    function loadRecords() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return createDemoRecords();
      try {
        return JSON.parse(raw);
      } catch {
        return createDemoRecords();
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function readForm() {
      const data = Object.fromEntries(new FormData(form));
      return {
        id: crypto.randomUUID(),
        sn: cleanSn(data.sn),
        category: data.category,
        brand: data.brand.trim(),
        name: data.name.trim(),
        model: data.model.trim(),
        partner: data.partner.trim(),
        buyPrice: toNumber(data.buyPrice),
        gift: toNumber(data.gift),
        shipping: toNumber(data.shipping),
        otherCost: toNumber(data.otherCost),
        salePrice: toNumber(data.salePrice),
        isSold: data.isSold === "yes",
        date: data.date || today,
        signedAt: data.signedAt || "",
        dockTracking: data.dockTracking.trim()
      };
    }

    function toNumber(value) {
      const number = Number(String(value).replace(/[^\d.]/g, ""));
      return Number.isFinite(number) ? number : 0;
    }

    function cleanSn(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function extractSn(text) {
      const normalized = String(text || "").toUpperCase().replace(/[\s:-]+/g, "");
      const matches = normalized.match(/[A-Z0-9]{8,24}/g) || [];
      return matches.find((item) => /[A-Z]/.test(item) && /\d/.test(item)) || "";
    }

    function costOf(item) {
      return item.buyPrice + item.gift + item.shipping + item.otherCost;
    }

    function profitOf(item) {
      return item.salePrice - costOf(item);
    }

    function isSold(item) {
      if (typeof item.isSold === "boolean") return item.isSold;
      return Number(item.salePrice || 0) > 0;
    }

    function realizedProfitOf(item) {
      return isSold(item) ? profitOf(item) : 0;
    }

    function render() {
      renderStats();
      renderRecords();
      updateLiveProfit();
    }

    function renderStats() {
      const month = today.slice(0, 7);
      const monthRecords = records.filter((item) => isSold(item) && String(item.date).startsWith(month));
      const sale = sum(monthRecords, "salePrice");
      const cost = monthRecords.reduce((total, item) => total + costOf(item), 0);
      const profit = sale - cost;
      const avg = monthRecords.length ? profit / monthRecords.length : 0;

      document.querySelector("#monthProfit").textContent = money.format(profit);
      document.querySelector("#monthSales").textContent = money.format(sale);
      document.querySelector("#monthCost").textContent = money.format(cost);
      document.querySelector("#avgProfit").textContent = money.format(avg);
      document.querySelector("#profitRate").textContent = `${monthRecords.length} 台已卖`;
    }

    function renderRecords() {
      const keyword = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;
      const filtered = records.filter((item) => {
        const haystack = [
          item.sn,
          item.brand,
          item.name,
          item.model,
          item.partner,
          item.date,
          item.signedAt,
          item.dockTracking
        ].join(" ").toLowerCase();
        return (!keyword || haystack.includes(keyword)) && (!category || item.category === category);
      });

      if (!filtered.length) {
        recordList.innerHTML = `<div class="glass empty">没有找到对应记录</div>`;
        return;
      }

      recordList.innerHTML = filtered.map((item) => {
        const profit = profitOf(item);
        const sold = isSold(item);
        const returnState = returnCountdown(item.signedAt);
        return `
          <article class="record">
            <div class="record-head">
              <div>
                <h3>${escapeHtml(item.brand)} ${escapeHtml(item.name)}</h3>
                <p class="sn">${escapeHtml(item.sn)}</p>
              </div>
              <div class="tag-stack">
                <span class="tag ${!sold || profit < 0 ? "loss" : ""}">${sold ? money.format(profit) : "待卖出"}</span>
                <span class="return-pill ${returnState.className}">${returnState.label}</span>
              </div>
            </div>
            <div class="meta">
              <div><span>总成本</span><strong>${money.format(costOf(item))}</strong></div>
              <div><span>卖出价</span><strong>${sold ? money.format(item.salePrice) : "-"}</strong></div>
              <div><span>下单人</span><strong>${escapeHtml(item.partner || "-")}</strong></div>
              <div><span>下单日期</span><strong>${escapeHtml(item.date || "-")}</strong></div>
              <div><span>签收时间</span><strong>${escapeHtml(formatDateTime(item.signedAt))}</strong></div>
              <div><span>档口快递</span><strong>${escapeHtml(item.dockTracking || "-")}</strong></div>
            </div>
            <div class="record-actions">
              <button class="ghost" data-copy="${item.id}" type="button">复制 SN</button>
              <button class="delete" data-delete="${item.id}" type="button" aria-label="删除记录">x</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function sum(items, key) {
      return items.reduce((total, item) => total + Number(item[key] || 0), 0);
    }

    function updateLiveProfit() {
      const record = readForm();
      document.querySelector("#liveCost").textContent = money.format(costOf(record));
      document.querySelector("#liveProfit").textContent = record.isSold ? money.format(profitOf(record)) : "待卖出";
    }

    function daysAgo(days) {
      const date = new Date(now);
      date.setDate(date.getDate() - days);
      return date;
    }

    function localDateTimeValue(date) {
      const offsetDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return offsetDate.toISOString().slice(0, 16);
    }

    function formatDateTime(value) {
      if (!value) return "-";
      return String(value).replace("T", " ");
    }

    function returnCountdown(value) {
      if (!value) return { label: "未签收", className: "pending" };

      const signed = new Date(value);
      if (Number.isNaN(signed.getTime())) return { label: "未签收", className: "pending" };

      const end = new Date(signed);
      end.setDate(end.getDate() + 7);
      const msLeft = end.getTime() - Date.now();

      if (msLeft <= 0) return { label: "已过7天", className: "expired" };
      if (msLeft <= 24 * 60 * 60 * 1000) return { label: "24小时内", className: "" };

      const daysLeft = Math.ceil(msLeft / (24 * 60 * 60 * 1000));
      return { label: `还剩${daysLeft}天`, className: "safe" };
    }

    function normalizeSnInput(showMessage = true) {
      const cleaned = cleanSn(snInput.value);
      if (snInput.value !== cleaned) snInput.value = cleaned;
      if (showMessage && cleaned) checkDuplicate();
    }

    function checkDuplicate() {
      const sn = cleanSn(snInput.value);
      if (!sn) {
        showHint("");
        return;
      }
      const duplicate = records.find((item) => item.sn === sn);
      if (duplicate) {
        showHint(`重复 SN：已在 ${duplicate.name} 里记录过。`, true);
        return;
      }
      showHint("SN 看起来可用。");
    }

    async function scanImage() {
      const file = imageInput.files?.[0];
      if (!file) return;

      if (!("BarcodeDetector" in window)) {
        showHint("当前浏览器不支持图片条码识别，正式版可接入 OCR 服务。", true);
        imageInput.value = "";
        return;
      }

      try {
        const detector = new BarcodeDetector({ formats: ["qr_code", "code_128", "ean_13", "ean_8"] });
        const bitmap = await createImageBitmap(file);
        const codes = await detector.detect(bitmap);
        const sn = extractSn(codes.map((code) => code.rawValue).join(" "));
        if (!sn) {
          showHint("图片里没有识别到 SN，可以换更清晰的条码图。", true);
          return;
        }
        snInput.value = sn;
        normalizeSnInput();
        updateLiveProfit();
      } catch {
        showHint("这张图暂时没识别出来，可以先手动输入或粘贴。", true);
      } finally {
        imageInput.value = "";
      }
    }

    function switchTab(name) {
      document.querySelector(`[data-tab="${name}"]`).click();
    }

    function showHint(message, warning = false) {
      hint.textContent = message;
      hint.classList.toggle("warn", warning);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }
  </script>
</body>
</html>
